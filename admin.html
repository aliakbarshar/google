<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Review System - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-3 md:p-6">

    <div class="max-w-4xl mx-auto space-y-4">
        <!-- Header -->
        <header class="bg-slate-800 border border-slate-700 p-4 rounded-2xl shadow-lg flex justify-between items-center">
            <div>
                <h1 class="font-bold text-base text-white">Admin Dashboard</h1>
                <p id="admin-email-display" class="text-xs text-slate-400">Loading...</p>
            </div>
            <button onclick="logoutAdmin()" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded-xl font-bold">Sign Out</button>
        </header>

        <!-- Admin Auth Block -->
        <div id="admin-auth-block" class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow space-y-4 max-w-md mx-auto">
            <h2 class="text-sm font-bold text-center text-slate-200">Admin Sign In</h2>
            <form id="form-admin-login" onsubmit="event.preventDefault(); handleAdminLogin();" class="space-y-3">
                <input type="email" id="admin-email" placeholder="Admin Email" required class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-xs outline-none text-white">
                <input type="password" id="admin-pass" placeholder="Password" required class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-xs outline-none text-white">
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs">Login as Admin</button>
            </form>
        </div>

        <!-- Admin Main Dashboard -->
        <div id="admin-main" class="hidden space-y-4">
            
            <!-- Navigation Tabs -->
            <div class="grid grid-cols-3 bg-slate-800 border border-slate-700 p-1 rounded-2xl text-xs font-bold text-center gap-1">
                <button onclick="switchAdminTab('tasks')" id="atab-tasks" class="py-2.5 rounded-xl bg-slate-700 text-white">Manage Tasks</button>
                <button onclick="switchAdminTab('submissions')" id="atab-submissions" class="py-2.5 rounded-xl text-slate-400">Review Proofs</button>
                <button onclick="switchAdminTab('withdrawals')" id="atab-withdrawals" class="py-2.5 rounded-xl text-slate-400">Withdrawals</button>
            </div>

            <!-- TAB 1: MANAGE & CREATE TASKS -->
            <div id="asec-tasks" class="space-y-4">
                <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl shadow space-y-3">
                    <h3 class="font-bold text-xs text-slate-200">Create New Review Task</h3>
                    <form onsubmit="event.preventDefault(); createNewTask();" class="space-y-3">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <input type="url" id="t-maps" placeholder="Google Maps Link" required class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-xs outline-none text-white">
                            <input type="number" id="t-reward" placeholder="Reward (e.g. 20)" value="20" required class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-xs outline-none text-white">
                        </div>
                        <textarea id="t-review" placeholder="Review Text to post..." rows="2" required class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-xs outline-none text-white"></textarea>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <input type="email" id="t-target-gmail" placeholder="Target Gmail (Optional)" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-xs outline-none text-white">
                            <input type="text" id="t-msg" placeholder="Special Instructions (Optional)" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-xs outline-none text-white">
                        </div>
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs">Publish Task</button>
                    </form>
                </div>

                <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl shadow space-y-3">
                    <h3 class="font-bold text-xs text-slate-200">Active Tasks List</h3>
                    <div id="admin-tasks-list" class="space-y-2">
                        <p class="text-xs text-slate-400 text-center py-4">Loading tasks...</p>
                    </div>
                </div>
            </div>

            <!-- TAB 2: REVIEW SUBMISSIONS -->
            <div id="asec-submissions" class="hidden space-y-3">
                <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl shadow space-y-3">
                    <h3 class="font-bold text-xs text-slate-200">User Submissions (Proofs)</h3>
                    <div id="admin-submissions-list" class="space-y-3">
                        <p class="text-xs text-slate-400 text-center py-4">Loading submissions...</p>
                    </div>
                </div>
            </div>

            <!-- TAB 3: WITHDRAWALS REQUESTS -->
            <div id="asec-withdrawals" class="hidden space-y-3">
                <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl shadow space-y-3">
                    <h3 class="font-bold text-xs text-slate-200">User Withdrawal Requests</h3>
                    <div id="admin-withdrawals-list" class="space-y-3">
                        <p class="text-xs text-slate-400 text-center py-4">Loading withdrawals...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
    const SUPABASE_URL = 'https://zpglwxppgzdjirnvvlfg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwZ2x3eHBwZ3pkamlybnZ2bGZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyNzg1NTksImV4cCI6MjEwNDg1NDU1OX0.ZnQm9NqG4UMU7BNadusvKN0s8CU4Evkzxzk2iJckpO4';
    
    let _supabase = null;
    let currentAdmin = null;

    function initAdmin(retries = 5) {
        if (window.supabase && typeof window.supabase.createClient === 'function') {
            _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            checkAdminSession();
        } else if (retries > 0) setTimeout(() => initAdmin(retries - 1), 300);
    }

    async function handleAdminLogin() {
        const email = document.getElementById('admin-email').value.trim();
        const password = document.getElementById('admin-pass').value.trim();
        const { error } = await _supabase.auth.signInWithPassword({ email, password });
        if(error) alert("Login error: " + error.message);
        else checkAdminSession();
    }

    async function checkAdminSession() {
        const { data: { user } } = await _supabase.auth.getUser();
        if(user) {
            currentAdmin = user;
            document.getElementById('admin-auth-block').classList.add('hidden');
            document.getElementById('admin-main').classList.remove('hidden');
            document.getElementById('admin-email-display').innerText = user.email;
            loadAdminData();
        } else {
            currentAdmin = null;
            document.getElementById('admin-auth-block').classList.remove('hidden');
            document.getElementById('admin-main').classList.add('hidden');
        }
    }

    function switchAdminTab(tab) {
        ['tasks', 'submissions', 'withdrawals'].forEach(t => {
            document.getElementById(`asec-${t}`).classList.add('hidden');
            document.getElementById(`atab-${t}`).className = "py-2.5 rounded-xl text-slate-400";
        });
        document.getElementById(`asec-${tab}`).classList.remove('hidden');
        document.getElementById(`atab-${tab}`).className = "py-2.5 rounded-xl bg-slate-700 text-white font-bold";
        
        if(tab === 'withdrawals') loadAdminWithdrawals();
        if(tab === 'submissions') loadAdminSubmissions();
        if(tab === 'tasks') loadAdminTasks();
    }

    async function loadAdminData() {
        loadAdminTasks();
        loadAdminSubmissions();
        loadAdminWithdrawals();
    }

    async function createNewTask() {
        const mapsLink = document.getElementById('t-maps').value.trim();
        const reward = parseFloat(document.getElementById('t-reward').value);
        const reviewText = document.getElementById('t-review').value.trim();
        const targetGmail = document.getElementById('t-target-gmail').value.trim();
        const adminMsg = document.getElementById('t-msg').value.trim();

        const { error } = await _supabase.from('tasks').insert([{
            google_maps_link: mapsLink,
            reward: reward,
            review_text: reviewText,
            target_gmail: targetGmail || null,
            admin_message: adminMsg || null,
            status: 'active'
        }]);

        if(!error) {
            alert("Task created successfully!");
            document.getElementById('t-maps').value = '';
            document.getElementById('t-review').value = '';
            document.getElementById('t-target-gmail').value = '';
            document.getElementById('t-msg').value = '';
            loadAdminTasks();
        } else alert("Error: " + error.message);
    }

    async function loadAdminTasks() {
        const container = document.getElementById('admin-tasks-list');
        const { data: tasks, error } = await _supabase.from('tasks').select('*').order('id', { ascending: false });
        if(error) return container.innerHTML = `<p class="text-xs text-red-400">Error: ${error.message}</p>`;

        if(tasks && tasks.length > 0) {
            let html = '';
            tasks.forEach(t => {
                html += `
                    <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 flex justify-between items-center text-xs">
                        <div>
                            <p class="font-bold text-slate-200">Task #${t.id} - <span class="text-emerald-400">Rs. ${t.reward}</span></p>
                            <p class="text-[11px] text-slate-400 truncate max-w-xs">${t.review_text}</p>
                        </div>
                        <button onclick="deleteTask(${t.id})" class="bg-red-600/20 text-red-400 px-3 py-1.5 rounded-lg font-bold hover:bg-red-600 hover:text-white transition">Delete</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        } else {
            container.innerHTML = '<p class="text-xs text-slate-400 text-center py-3">No tasks found.</p>';
        }
    }

    async function deleteTask(id) {
        if(!confirm("Are you sure you want to delete this task?")) return;
        const { error } = await _supabase.from('tasks').delete().eq('id', id);
        if(!error) loadAdminTasks();
        else alert("Error: " + error.message);
    }

    async function loadAdminSubmissions() {
        const container = document.getElementById('admin-submissions-list');
        const { data: subs, error } = await _supabase.from('submissions').select('*, tasks(reward)').eq('status', 'pending').order('id', { ascending: false });
        if(error) return container.innerHTML = `<p class="text-xs text-red-400">Error: ${error.message}</p>`;

        if(subs && subs.length > 0) {
            let html = '';
            for(let s of subs) {
                // Fetch user profile email/name
                const { data: userProf } = await _supabase.from('profiles').select('full_name, email').eq('id', s.user_id).single();
                const userName = userProf ? (userProf.full_name || userProf.email) : 'User';
                const rewardAmount = s.tasks ? s.tasks.reward : 20;

                html += `
                    <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 space-y-2 text-xs">
                        <div class="flex justify-between items-center font-bold text-slate-200">
                            <span>User: ${userName}</span>
                            <span class="text-emerald-400">Reward: Rs. ${rewardAmount}</span>
                        </div>
                        <p class="text-[11px] text-slate-300"><strong>Proof Link:</strong> <a href="${s.proof_link}" target="_blank" class="text-blue-400 underline">${s.proof_link}</a></p>
                        <div class="flex gap-2 pt-1">
                            <button onclick="approveSubmission(${s.id}, '${s.user_id}', ${rewardAmount})" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-lg">Approve & Pay</button>
                            <button onclick="rejectSubmission(${s.id})" class="bg-red-600/20 text-red-400 font-bold px-3 py-1.5 rounded-lg hover:bg-red-600 hover:text-white">Reject</button>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        } else {
            container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">No pending submissions.</p>';
        }
    }

    async function approveSubmission(subId, userId, reward) {
        // 1. Get user current balance
        const { data: prof } = await _supabase.from('profiles').select('balance').eq('id', userId).single();
        const currentBal = prof ? (prof.balance || 0) : 0;
        const newBal = currentBal + reward;

        // 2. Update user balance
        await _supabase.from('profiles').update({ balance: newBal }).eq('id', userId);

        // 3. Update submission status to approved
        const { error } = await _supabase.from('submissions').update({ status: 'approved' }).eq('id', subId);

        if(!error) {
            alert("Submission approved and amount added to user balance!");
            loadAdminSubmissions();
        } else alert("Error: " + error.message);
    }

    async function rejectSubmission(subId) {
        const { error } = await _supabase.from('submissions').update({ status: 'rejected' }).eq('id', subId);
        if(!error) {
            alert("Submission rejected.");
            loadAdminSubmissions();
        } else alert("Error: " + error.message);
    }

    async function loadAdminWithdrawals() {
        const container = document.getElementById('admin-withdrawals-list');
        const { data: wList, error } = await _supabase.from('withdrawals').select('*').eq('status', 'pending').order('id', { ascending: false });
        if(error) return container.innerHTML = `<p class="text-xs text-red-400">Error: ${error.message}</p>`;

        if(wList && wList.length > 0) {
            let html = '';
            for(let w of wList) {
                // Fetch user info
                const { data: userProf } = await _supabase.from('profiles').select('full_name, email, balance').eq('id', w.user_id).single();
                const userName = userProf ? (userProf.full_name || userProf.email) : 'User';
                const userBal = userProf ? (userProf.balance || 0) : 0;

                html += `
                    <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 space-y-2 text-xs">
                        <div class="flex justify-between items-center font-bold text-slate-200">
                            <span>User: ${userName}</span>
                            <span class="text-amber-400 font-black text-sm">Rs. ${w.amount}</span>
                        </div>
                        <div class="bg-slate-800 p-2 rounded border border-slate-700 space-y-1">
                            <p class="text-[11px] text-slate-300"><strong>Method:</strong> ${w.method}</p>
                            <p class="text-[11px] text-slate-300"><strong>Account Number:</strong> <span class="font-mono text-emerald-400">${w.account_number}</span></p>
                        </div>
                        <div class="flex gap-2 pt-1">
                            <button onclick="approveWithdrawal(${w.id}, '${w.user_id}', ${w.amount}, ${userBal})" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-lg">Mark Paid & Deduct</button>
                            <button onclick="rejectWithdrawal(${w.id})" class="bg-red-600/20 text-red-400 font-bold px-3 py-1.5 rounded-lg hover:bg-red-600 hover:text-white">Reject</button>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        } else {
            container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">No pending withdrawal requests.</p>';
        }
    }

    async function approveWithdrawal(wId, userId, amount, currentBal) {
        if(amount > currentBal) {
            return alert("User doesn't have enough balance currently!");
        }

        const newBal = currentBal - amount;

        // 1. Deduct amount from user balance
        await _supabase.from('profiles').update({ balance: newBal }).eq('id', userId);

        // 2. Update withdrawal request status to approved/paid
        const { error } = await _supabase.from('withdrawals').update({ status: 'approved' }).eq('id', wId);

        if(!error) {
            alert("Withdrawal approved, amount deducted from user balance!");
            loadAdminWithdrawals();
        } else alert("Error: " + error.message);
    }

    async function rejectWithdrawal(wId) {
        const { error } = await _supabase.from('withdrawals').update({ status: 'rejected' }).eq('id', wId);
        if(!error) {
            alert("Withdrawal request rejected.");
            loadAdminWithdrawals();
        } else alert("Error: " + error.message);
    }

    async function logoutAdmin() {
        await _supabase.auth.signOut();
        location.reload();
    }

    document.addEventListener('DOMContentLoaded', () => initAdmin());
    </script>
</body>
</html>
