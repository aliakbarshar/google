<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Studio Control Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding-bottom: 50px;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }
    .card-header {
      background-color: #0f172a;
      border-bottom: 1px solid #334155;
      color: #38bdf8;
      font-weight: bold;
    }
    .form-control, .form-select {
      background-color: #0f172a;
      border: 1px solid #475569;
      color: #f8fafc;
      border-radius: 8px;
    }
    .form-control:focus, .form-select:focus {
      background-color: #0f172a;
      color: #fff;
      border-color: #38bdf8;
      box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
    }
    .btn-live {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: white;
      font-weight: bold;
      font-size: 1.1rem;
    }
    .btn-stop {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      font-weight: bold;
      font-size: 1.1rem;
    }
    .badge-live {
      background-color: #22c55e;
      animation: pulse 1.5s infinite;
    }
    .badge-off {
      background-color: #64748b;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
    .playlist-item {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2><i class="fa-solid fa-tower-broadcast text-info me-2"></i> لائيو اسٽوڊيو ڪنٽرول پينل</h2>
      <div>
        <span id="liveStatusBadge" class="badge badge-off fs-6 p-2"><i class="fa-solid fa-circle me-1"></i> اسٽريم بند آهي</span>
      </div>
    </div>

    <!-- Control Buttons -->
    <div class="card mb-4">
      <div class="card-body d-flex justify-content-around align-items-center flex-wrap gap-3">
        <button id="btnToggleLive" onclick="toggleLiveState()" class="btn btn-live btn-lg px-5 py-2">
          <i class="fa-solid fa-play me-2"></i> ▶️ Go Live
        </button>
        <button onclick="triggerManualRestart()" class="btn btn-warning btn-lg px-4 text-dark font-bold">
          <i class="fa-solid fa-floppy-disk me-2"></i> سيٽنگس سيف ڪريو / ريلوڊ
        </button>
      </div>
    </div>

    <div class="row g-4">
      <!-- Stream Keys & Overlay -->
      <div class="col-md-6">
        <div class="card mb-4">
          <div class="card-header"><i class="fa-solid fa-key me-2"></i> اسٽريمنگ ڪيز (Destination Keys)</div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label"><i class="fa-brands fa-facebook text-primary me-1"></i> Facebook Stream Key / RTMPS URL</label>
              <input type="text" id="fbKey" class="form-control" placeholder="rtmps://live-api-s.facebook.com:443/rtmp/FB-XXXXX">
            </div>
            <div class="mb-3">
              <label class="form-label"><i class="fa-brands fa-youtube text-danger me-1"></i> YouTube Stream Key / RTMP URL</label>
              <input type="text" id="ytKey" class="form-control" placeholder="rtmp://a.rtmp.youtube.com/live2/XXXX-XXXX">
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><i class="fa-solid fa-wand-magic-sparkles me-2"></i> وڊيو اوورلي ۽ ٽيڪسٽ سيٽنگس</div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label">پروگرام جو نالو / ٽائيٽل</label>
              <input type="text" id="programName" class="form-control" placeholder="مثال: لائيو پروگرام">
            </div>
            <div class="mb-3">
              <label class="form-label">هيٺين ٽيڪر پٽي (Ticker Scroll Text)</label>
              <input type="text" id="tickerText" class="form-control" placeholder="لائيو نيوز پٽي...">
            </div>
            <div class="mb-3">
              <label class="form-label">لوگو لنڪ (Logo Image Direct URL)</label>
              <input type="text" id="logoUrl" class="form-control" placeholder="https://domain.com/logo.png">
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label">لوگو جي سائيز</label>
                <input type="number" id="logoSize" class="form-control" value="120">
              </div>
              <div class="col-6 mb-3">
                <label class="form-label">لوگو جي جڳهه</label>
                <select id="logoPosition" class="form-select">
                  <option value="top-right">مٿي ساڄي (Top Right)</option>
                  <option value="top-left">مٿي باٻي (Top Left)</option>
                  <option value="bottom-right">هيٺ ساڄي (Bottom Right)</option>
                  <option value="bottom-left">هيٺ باٻي (Bottom Left)</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Playlist Management -->
      <div class="col-md-6">
        <div class="card h-100">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="fa-solid fa-list-check me-2"></i> پلي لسٽ (MP4 Direct Links)</span>
            <button onclick="addPlaylistItem()" class="btn btn-sm btn-info text-white"><i class="fa-solid fa-plus me-1"></i> لنڪ جوڙيو</button>
          </div>
          <div class="card-body">
            <p class="text-muted small mb-3">وڊيوز پوري ٿيڻ بعد آٽوميٽڪ نئين وڊيو شروع ٿيندي.</p>
            <div id="playlistContainer"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://zpglwxppgzdjirnvvlfg.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwZ2x3eHBwZ3pkamlybnZ2bGZnIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4OTI3ODU1OSwiZXhwIjoyMTA0ODU0NTU5fQ.oV7-HhtrPXD0AhiDyA26SLqQfJWoMJS1lY5JO18TBWs';
    
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isLiveState = false;
    let localPlaylist = [];
    let isUserEditing = false;

    document.addEventListener('focusin', (e) => {
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) {
        isUserEditing = true;
      }
    });

    document.addEventListener('focusout', (e) => {
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) {
        setTimeout(() => { isUserEditing = false; }, 2000);
      }
    });

    async function loadConfiguration() {
      if (isUserEditing) return;

      const { data, error } = await db.from('stream_config').select('*').eq('id', 1).single();
      if (error || !data) return;

      isLiveState = data.is_live;
      updateUIStatus(data.is_live);

      if (!isUserEditing) {
        document.getElementById('fbKey').value = data.fb_key || '';
        document.getElementById('ytKey').value = data.yt_key || '';
        document.getElementById('programName').value = data.program_name || '';
        document.getElementById('tickerText').value = data.ticker_text || '';
        document.getElementById('logoUrl').value = data.logo_url || '';
        document.getElementById('logoSize').value = data.logo_size || 120;
        document.getElementById('logoPosition').value = data.logo_position || 'top-right';

        if (Array.isArray(data.playlist) && data.playlist.length > 0) {
          localPlaylist = data.playlist;
        } else {
          localPlaylist = [{ url: '' }];
        }
        renderPlaylistUI();
      }
    }

    function updateUIStatus(isLive) {
      const badge = document.getElementById('liveStatusBadge');
      const btn = document.getElementById('btnToggleLive');

      if (isLive) {
        badge.className = 'badge badge-live fs-6 p-2';
        badge.innerHTML = '<i class="fa-solid fa-broadcast-tower me-1"></i> لائيو نشر ٿي رهيو آهي';
        btn.className = 'btn btn-stop btn-lg px-5 py-2';
        btn.innerHTML = '<i class="fa-solid fa-stop me-2"></i> ⏹️ Stop Live';
      } else {
        badge.className = 'badge badge-off fs-6 p-2';
        badge.innerHTML = '<i class="fa-solid fa-circle me-1"></i> اسٽريم بند آهي';
        btn.className = 'btn btn-live btn-lg px-5 py-2';
        btn.innerHTML = '<i class="fa-solid fa-play me-2"></i> ▶️ Go Live';
      }
    }

    function renderPlaylistUI() {
      const container = document.getElementById('playlistContainer');
      container.innerHTML = '';

      localPlaylist.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'playlist-item d-flex align-items-center gap-2';
        div.innerHTML = `
          <span class="text-info font-bold me-1">#${index + 1}</span>
          <input type="text" class="form-control form-control-sm" value="${item.url || ''}" onchange="updatePlaylistUrl(${index}, this.value)" placeholder="https://direct-video-url.mp4">
          <button class="btn btn-sm btn-outline-danger" onclick="removePlaylistItem(${index})"><i class="fa-solid fa-trash"></i></button>
        `;
        container.appendChild(div);
      });
    }

    function addPlaylistItem() {
      localPlaylist.push({ url: '' });
      renderPlaylistUI();
    }

    function removePlaylistItem(index) {
      if (localPlaylist.length <= 1) return;
      localPlaylist.splice(index, 1);
      renderPlaylistUI();
    }

    function updatePlaylistUrl(index, value) {
      localPlaylist[index].url = value.trim();
    }

    async function saveConfigToDatabase(newLiveStatus = null) {
      const isLive = (newLiveStatus !== null) ? newLiveStatus : isLiveState;
      
      const payload = {
        id: 1, // ID ثابت رکيو ويو آهي
        is_live: isLive,
        fb_key: document.getElementById('fbKey').value.trim(),
        yt_key: document.getElementById('ytKey').value.trim(),
        program_name: document.getElementById('programName').value.trim(),
        ticker_text: document.getElementById('tickerText').value.trim(),
        logo_url: document.getElementById('logoUrl').value.trim(),
        logo_size: parseInt(document.getElementById('logoSize').value) || 120,
        logo_position: document.getElementById('logoPosition').value,
        playlist: localPlaylist.filter(p => p.url && p.url.trim() !== ''),
        restart_trigger: Date.now()
      };

      // .update() جي جڳهه تي .upsert() استعمال ڪيو ويو آهي تاڪي ID 1 نه هجڻ جي صورت ۾ پاڻهي جڙي وڃي
      const { error } = await db.from('stream_config').upsert(payload);
      
      if (error) {
        console.error("Supabase Save Error Details:", error);
        alert("سيٽنگس سيف ڪرڻ ۾ ايرر آيو: " + error.message);
      } else {
        isLiveState = isLive;
        updateUIStatus(isLive);
        alert("سيٽنگس ڪاميابي سان سيف ٿي ويون!");
      }
    }

    function toggleLiveState() {
      saveConfigToDatabase(!isLiveState);
    }

    function triggerManualRestart() {
      saveConfigToDatabase(isLiveState);
    }

    // Initial Load & Polling setup
    loadConfiguration();
    setInterval(loadConfiguration, 5000);
  </script>
</body>
</html>
